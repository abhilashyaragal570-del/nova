<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font-family: system-ui, Segoe UI, sans-serif;
    background: #15171c; color: #e8e8ea;
  }
  #sidebar {
    width: 220px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid #2a2d35; background: #181a20;
  }
  #newchat {
    margin: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid #3a3e48; background: #22252c; color: #e8e8ea; font-size: 14px;
  }
  #newchat:hover { background: #2c3039; }
  #convs { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .conv {
    display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    border-radius: 8px; cursor: pointer; font-size: 14px; color: #b8b8c0;
  }
  .conv:hover { background: #22252c; }
  .conv.active { background: #2a2e38; color: #fff; }
  .conv .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .x {
    background: none; border: none; color: #7d808a; cursor: pointer;
    font-size: 16px; line-height: 1; padding: 0 2px;
  }
  .conv .x:hover { color: #ff7b7b; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #2a2d35; }
  header h1 { margin: 0; font-size: 18px; }
  #personality {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid #2a2d35;
    font-size: 14px; color: #b8b8c0;
  }
  #prompt {
    flex: 1; padding: 8px 10px; border-radius: 6px;
    border: 1px solid #3a3e48; background: #1d2027; color: inherit; font-size: 14px;
  }
  #set {
    padding: 8px 14px; border: 1px solid #3a3e48; border-radius: 6px;
    background: #22252c; color: #e8e8ea; cursor: pointer;
  }
  #set:hover { background: #2c3039; }
  #status { min-width: 60px; font-size: 13px; color: #7bd88f; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 75%; padding: 10px 14px; border-radius: 12px;
    line-height: 1.45; overflow-wrap: anywhere;
  }
  .user { align-self: flex-end; background: #3b5bdb; color: #fff; white-space: pre-wrap; }
  .nova { align-self: flex-start; background: #23262e; }
  .nova .body > :first-child { margin-top: 0; }
  .nova .body > :last-child { margin-bottom: 0; }
  .nova p, .nova ul, .nova ol, .nova pre { margin: 0 0 10px; }
  .nova ul, .nova ol { padding-left: 22px; }
  .nova code {
    background: #15171c; padding: 2px 5px; border-radius: 4px;
    font-family: Consolas, monospace; font-size: 0.92em;
  }
  .nova pre {
    background: #15171c; padding: 10px 12px; border-radius: 8px; overflow-x: auto;
  }
  .nova pre code { padding: 0; background: none; }
  .meta { margin-top: 6px; font-size: 12px; color: #7d808a; }
  .meta:empty { display: none; }
  .typing { color: #8a8d96; font-style: italic; }
  .typing::after {
    content: "";
    animation: dots 1.2s steps(1, end) infinite;
  }
  @keyframes dots {
    0%   { content: ""; }
    25%  { content: "."; }
    50%  { content: ".."; }
    75%  { content: "..."; }
  }
  form {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid #2a2d35;
  }
  #box {
    flex: 1; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #3a3e48; background: #1d2027; color: inherit; font-size: 15px;
  }
  #send {
    min-width: 76px; padding: 10px 18px; border: none; border-radius: 8px;
    background: #3b5bdb; color: #fff; font-size: 15px; cursor: pointer;
  }
  #send.stop { background: #c92a2a; }
</style>
</head>
<body>
<aside id="sidebar">
  <button id="newchat" type="button">+ New chat</button>
  <div id="convs"></div>
</aside>
<div id="main">
  <header><h1>Nova</h1></header>
  <div id="personality">
    <label for="prompt">Personality:</label>
    <input id="prompt" type="text" autocomplete="off">
    <button id="set" type="button">Set</button>
    <span id="status"></span>
  </div>
  <div id="chat"></div>
  <form id="form">
    <input id="box" type="text" placeholder="Message Nova..." autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const box = document.getElementById("box");
  const send = document.getElementById("send");
  const promptBox = document.getElementById("prompt");
  const setBtn = document.getElementById("set");
  const status = document.getElementById("status");
  const convs = document.getElementById("convs");

  let currentId = "main";
  let controller = null;

  function renderMarkdown(el, text) {
    if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
      el.style.whiteSpace = "pre-wrap";
      el.textContent = text;
      return;
    }
    el.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  }

  function addMessage(who, text) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    const body = document.createElement("div");
    body.className = "body";
    if (who === "nova") {
      renderMarkdown(body, text);
    } else {
      body.textContent = text;
    }
    div.appendChild(body);
    const meta = document.createElement("div");
    meta.className = "meta";
    div.appendChild(meta);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return { body, meta };
  }

  function setStreaming(on) {
    send.textContent = on ? "Stop" : "Send";
    send.classList.toggle("stop", on);
  }

  async function refreshList() {
    const res = await fetch("/conversations");
    const items = await res.json();
    convs.innerHTML = "";
    for (const c of items) {
      const row = document.createElement("div");
      row.className = "conv" + (c.id === currentId ? " active" : "");
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = c.title;
      const x = document.createElement("button");
      x.className = "x";
      x.type = "button";
      x.textContent = "\u00d7";
      x.title = c.id === "main" ? "Clear this chat" : "Delete this chat";
      x.addEventListener("click", (e) => {
        e.stopPropagation();
        removeConv(c.id);
      });
      row.addEventListener("click", () => switchTo(c.id));
      row.append(t, x);
      convs.appendChild(row);
    }
  }

  async function switchTo(id) {
    if (controller) {
      controller.abort();
      controller = null;
      setStreaming(false);
    }
    currentId = id;
    chat.innerHTML = "";
    const res = await fetch("/conversations/" + id);
    if (!res.ok) {
      if (id !== "main") return switchTo("main");
      return;
    }
    const data = await res.json();
    if (currentId !== id) return;
    for (const m of data.messages) {
      addMessage(m.role === "user" ? "user" : "nova", m.text);
    }
    refreshList();
  }

  async function removeConv(id) {
    const msg = id === "main" ? "Clear the Main chat?" : "Delete this chat?";
    if (!confirm(msg)) return;
    await fetch("/conversations/" + id, { method: "DELETE" });
    if (id === currentId) {
      switchTo("main");
    } else {
      refreshList();
    }
  }

  document.getElementById("newchat").addEventListener("click", async () => {
    const res = await fetch("/conversations", { method: "POST" });
    const c = await res.json();
    await switchTo(c.id);
    box.focus();
  });

  async function loadSystem() {
    const res = await fetch("/system");
    const data = await res.json();
    promptBox.value = data.prompt;
  }

  function flashStatus(text) {
    status.textContent = text;
    setTimeout(() => { status.textContent = ""; }, 2000);
  }

  setBtn.addEventListener("click", async () => {
    const text = promptBox.value.trim();
    if (!text) {
      flashStatus("Empty!");
      return;
    }
    const res = await fetch("/system", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: text }),
    });
    flashStatus(res.ok ? "Saved" : "Error");
  });

  send.addEventListener("click", (e) => {
    if (controller) {
      e.preventDefault();
      controller.abort();
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (controller) return;
    const text = box.value.trim();
    if (!text) return;
    box.value = "";
    const myId = currentId;
    const myController = new AbortController();
    controller = myController;
    setStreaming(true);
    addMessage("user", text);
    const nova = addMessage("nova", "");
    nova.body.textContent = "Nova is typing";
    nova.body.classList.add("typing");
    let started = false;
    let full = "";
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, conversation: myId }),
        signal: myController.signal,
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        full += decoder.decode(value, { stream: true });
        const cut = full.indexOf("\u0000");
        const replyText = cut === -1 ? full : full.slice(0, cut);
        if (replyText) {
          if (!started) {
            nova.body.classList.remove("typing");
            started = true;
          }
          renderMarkdown(nova.body, replyText);
          chat.scrollTop = chat.scrollHeight;
        }
      }
      const cut = full.indexOf("\u0000");
      if (cut !== -1) {
        try {
          const u = JSON.parse(full.slice(cut + 1));
          nova.meta.textContent =
            "tokens: prompt " + u.prompt + " \u00b7 reply " + u.reply + " \u00b7 total " + u.total;
        } catch (err) {}
      }
      if (!started) {
        nova.body.classList.remove("typing");
        nova.body.textContent = "[No reply received.]";
      }
    } catch (err) {
      nova.body.classList.remove("typing");
      if (err.name === "AbortError") {
        if (!started) {
          nova.body.textContent = "[Stopped.]";
        } else {
          nova.meta.textContent = "stopped";
        }
      } else {
        nova.body.textContent = "[Could not reach the server.]";
      }
    }
    if (controller === myController) {
      controller = null;
      setStreaming(false);
    }
    box.focus();
    refreshList();
  });

  switchTo("main");
  loadSystem();
</script>
</body>
</html>
