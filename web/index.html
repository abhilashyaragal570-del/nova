<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: system-ui, Segoe UI, sans-serif;
    background: #15171c; color: #e8e8ea;
  }
  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; border-bottom: 1px solid #2a2d35;
  }
  header h1 { margin: 0; font-size: 18px; }
  #clear {
    background: none; border: 1px solid #3a3e48; color: #b8b8c0;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
  }
  #clear:hover { background: #22252c; }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg {
    max-width: 75%; padding: 10px 14px; border-radius: 12px;
    white-space: pre-wrap; line-height: 1.45;
  }
  .user { align-self: flex-end; background: #3b5bdb; color: #fff; }
  .nova { align-self: flex-start; background: #23262e; }
  form {
    display: flex; gap: 8px; padding: 12px 16px;
    border-top: 1px solid #2a2d35;
  }
  #box {
    flex: 1; padding: 10px 12px; border-radius: 8px;
    border: 1px solid #3a3e48; background: #1d2027; color: inherit; font-size: 15px;
  }
  #send {
    padding: 10px 18px; border: none; border-radius: 8px;
    background: #3b5bdb; color: #fff; font-size: 15px; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Nova</h1>
  <button id="clear" type="button">Clear memory</button>
</header>
<div id="chat"></div>
<form id="form">
  <input id="box" type="text" placeholder="Message Nova..." autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const box = document.getElementById("box");
  const send = document.getElementById("send");

  function addMessage(who, text) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  async function loadHistory() {
    const res = await fetch("/history");
    const messages = await res.json();
    for (const m of messages) {
      addMessage(m.role === "user" ? "user" : "nova", m.text);
    }
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = box.value.trim();
    if (!text) return;
    box.value = "";
    send.disabled = true;
    addMessage("user", text);
    const novaDiv = addMessage("nova", "");
    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        novaDiv.textContent += decoder.decode(value, { stream: true });
        chat.scrollTop = chat.scrollHeight;
      }
    } catch (err) {
      novaDiv.textContent = "[Could not reach the server.]";
    }
    send.disabled = false;
    box.focus();
  });

  document.getElementById("clear").addEventListener("click", async () => {
    if (!confirm("Clear Nova's memory?")) return;
    await fetch("/clear", { method: "POST" });
    chat.innerHTML = "";
  });

  loadHistory();
</script>
</body>
</html>
