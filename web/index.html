<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: flex; font-family: system-ui, Segoe UI, sans-serif; background: #15171c; color: #e8e8ea; }
  #sidebar { width: 220px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid #2a2d35; background: #181a20; }
  #newchat { margin: 12px; padding: 9px 12px; border-radius: 8px; cursor: pointer; border: 1px solid #3a3e48; background: #22252c; color: #e8e8ea; font-size: 14px; }
  #newchat:hover { background: #2c3039; }
  #convs { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .conv { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; color: #b8b8c0; }
  .conv:hover { background: #22252c; }
  .conv.active { background: #2a2e38; color: #fff; }
  .conv .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .x { background: none; border: none; color: #7d808a; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .conv .x:hover { color: #ff7b7b; }
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header { padding: 12px 16px; border-bottom: 1px solid #2a2d35; display: flex; align-items: center; justify-content: space-between; }
  header h1 { margin: 0; font-size: 18px; }
  #wftoggle { padding: 7px 14px; border: 1px solid #3a3e48; border-radius: 6px; background: #22252c; color: #e8e8ea; font-size: 14px; cursor: pointer; }
  #wftoggle:hover { background: #2c3039; }
  #agentbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid #2a2d35; font-size: 14px; color: #b8b8c0; }
  #agentselect { padding: 7px 10px; border-radius: 6px; border: 1px solid #3a3e48; background: #1d2027; color: #e8e8ea; font-size: 14px; }
  #agentclear { padding: 7px 12px; border: 1px solid #3a3e48; border-radius: 6px; background: #22252c; color: #e8e8ea; font-size: 14px; cursor: pointer; }
  #agentclear:hover { background: #2c3039; }
  #agentinfo { flex: 1; min-width: 160px; font-size: 13px; color: #7d808a; overflow-wrap: anywhere; }
  #personality { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid #2a2d35; font-size: 14px; color: #b8b8c0; }
  #prompt { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3e48; background: #1d2027; color: inherit; font-size: 14px; }
  #set { padding: 8px 14px; border: 1px solid #3a3e48; border-radius: 6px; background: #22252c; color: #e8e8ea; cursor: pointer; }
  #set:hover { background: #2c3039; }
  #status { min-width: 60px; font-size: 13px; color: #7bd88f; }
  #wfpanel { display: none; padding: 12px 16px; border-bottom: 1px solid #2a2d35; max-height: 45vh; overflow-y: auto; font-size: 14px; }
  #wfpanel.open { display: block; }
  .wfrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  #wfgoal { flex: 1; min-width: 180px; padding: 8px 10px; border-radius: 6px; border: 1px solid #3a3e48; background: #1d2027; color: inherit; font-size: 14px; }
  .wfcheck { font-size: 13px; color: #b8b8c0; white-space: nowrap; }
  .wfbtn { padding: 7px 14px; border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; background: #3b5bdb; }
  .wfbtn.yes { background: #2b8a3e; }
  .wfbtn.no { background: #c92a2a; }
  .wfbtn:disabled { opacity: 0.5; cursor: default; }
  #wfmsg { color: #ffb347; margin-bottom: 6px; }
  #wfmsg:empty, #wferr:empty, #wfstate:empty { display: none; }
  #wferr { color: #ff7b7b; margin-bottom: 6px; }
  #wfstate { margin-bottom: 6px; color: #b8b8c0; }
  #wfpanel pre { margin: 0 0 10px; padding: 8px 10px; border-radius: 6px; overflow-x: auto; background: #15171c; font-family: Consolas, monospace; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .wftask { display: flex; gap: 10px; padding: 3px 0; }
  .wftask .st { min-width: 84px; font-size: 13px; color: #8a8d96; }
  .wftask .st.running { color: #ffb347; }
  .wftask .st.succeeded { color: #7bd88f; }
  .wftask .st.failed { color: #ff7b7b; }
  .wftask .detail { color: #7d808a; font-size: 13px; overflow-wrap: anywhere; }
  .wfhead { margin: 10px 0 4px; font-size: 13px; color: #7d808a; }
  .wfsaved { display: flex; gap: 10px; align-items: center; padding: 3px 0; font-size: 13px; }
  .wfsaved .s { min-width: 84px; color: #8a8d96; }
  .wfsaved .g { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; line-height: 1.45; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: #3b5bdb; color: #fff; white-space: pre-wrap; }
  .nova { align-self: flex-start; background: #23262e; }
  .nova .body > :first-child { margin-top: 0; }
  .nova .body > :last-child { margin-bottom: 0; }
  .nova p, .nova ul, .nova ol, .nova pre { margin: 0 0 10px; }
  .nova ul, .nova ol { padding-left: 22px; }
  .nova code { background: #15171c; padding: 2px 5px; border-radius: 4px; font-family: Consolas, monospace; font-size: 0.92em; }
  .nova pre { background: #15171c; padding: 10px 12px; border-radius: 8px; overflow-x: auto; }
  .nova pre code { padding: 0; background: none; }
  .meta { margin-top: 6px; font-size: 12px; color: #7d808a; }
  .meta:empty { display: none; }
  .typing { color: #8a8d96; font-style: italic; }
  .typing::after { content: ""; animation: dots 1.2s steps(1, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #2a2d35; }
  #box { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #3a3e48; background: #1d2027; color: inherit; font-size: 15px; }
  #send { min-width: 76px; padding: 10px 18px; border: none; border-radius: 8px; background: #3b5bdb; color: #fff; font-size: 15px; cursor: pointer; }
  #send.stop { background: #c92a2a; }
  #approvals { padding: 0 16px; }
  .approval { margin: 8px 0; padding: 12px 14px; border-radius: 10px; border: 1px solid #b08900; background: #2a2616; }
  .approval .title { font-size: 14px; margin-bottom: 6px; }
  .approval pre { margin: 0 0 10px; padding: 8px 10px; border-radius: 6px; overflow-x: auto; background: #15171c; font-family: Consolas, monospace; font-size: 13px; max-height: 160px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .approval button { padding: 7px 16px; margin-right: 8px; border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; }
  .approval .yes { background: #2b8a3e; }
  .approval .no { background: #c92a2a; }
  .approval button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<aside id="sidebar">
  <button id="newchat" type="button">+ New chat</button>
  <div id="convs"></div>
</aside>
<div id="main">
  <header>
    <h1>Nova</h1>
    <button id="wftoggle" type="button">Workflows</button>
  </header>
  <div id="agentbar" hidden>
    <label for="agentselect">Chat with:</label>
    <select id="agentselect">
      <option value="">Nova (main chat)</option>
    </select>
    <button id="agentclear" type="button" hidden>Clear this agent's chat</button>
    <span id="agentinfo"></span>
  </div>
  <div id="personality">
    <label for="prompt">Personality:</label>
    <input id="prompt" type="text" autocomplete="off">
    <button id="set" type="button">Set</button>
    <span id="status"></span>
  </div>
  <div id="wfpanel">
    <div id="wfform" class="wfrow">
      <input id="wfgoal" type="text" placeholder="Give Nova a goal, e.g. list the files in my workspace folder" autocomplete="off">
      <label class="wfcheck"><input id="wfwrite" type="checkbox"> Allow tools that change things</label>
      <button id="wfplanbtn" class="wfbtn" type="button">Plan</button>
    </div>
    <div id="wfmsg"></div>
    <div id="wfstate"></div>
    <div id="wferr"></div>
    <pre id="wfplan" hidden></pre>
    <div id="wfactions" class="wfrow"></div>
    <div id="wftasks"></div>
    <pre id="wfresult" hidden></pre>
    <div class="wfhead">Saved workflows</div>
    <div id="wfsaved"></div>
  </div>
  <div id="chat"></div>
  <div id="approvals"></div>
  <form id="form">
    <input id="box" type="text" placeholder="Message Nova..." autocomplete="off" autofocus>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const box = document.getElementById("box");
  const send = document.getElementById("send");
  const promptBox = document.getElementById("prompt");
  const setBtn = document.getElementById("set");
  const status = document.getElementById("status");
  const convs = document.getElementById("convs");
  const agentBar = document.getElementById("agentbar");
  const agentSelect = document.getElementById("agentselect");
  const agentInfo = document.getElementById("agentinfo");
  const agentClear = document.getElementById("agentclear");

  let currentId = "main";
  let currentAgent = null;
  let controller = null;
  const agentSpecs = new Map();

  function renderMarkdown(el, text) {
    if (typeof marked === "undefined" || typeof DOMPurify === "undefined") {
      el.style.whiteSpace = "pre-wrap";
      el.textContent = text;
      return;
    }
    el.innerHTML = DOMPurify.sanitize(marked.parse(text, { breaks: true }));
  }

  function addMessage(who, text) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    const body = document.createElement("div");
    body.className = "body";
    if (who === "nova") {
      renderMarkdown(body, text);
    } else {
      body.textContent = text;
    }
    div.appendChild(body);
    const meta = document.createElement("div");
    meta.className = "meta";
    div.appendChild(meta);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return { body, meta };
  }

  function setStreaming(on) {
    send.textContent = on ? "Stop" : "Send";
    send.classList.toggle("stop", on);
  }

  function updateAgentUi() {
    box.placeholder = currentAgent ? "Message " + currentAgent + "..." : "Message Nova...";
    agentClear.hidden = !currentAgent;
    agentSelect.value = currentAgent || "";
    const spec = currentAgent ? agentSpecs.get(currentAgent) : null;
    agentInfo.textContent = spec
      ? spec.description + " Tools: " + spec.tools.join(", ") + "."
      : "";
  }

  async function refreshList() {
    const res = await fetch("/conversations");
    const items = await res.json();
    convs.innerHTML = "";
    for (const c of items) {
      const row = document.createElement("div");
      row.className = "conv" + (c.id === currentId ? " active" : "");
      const t = document.createElement("span");
      t.className = "t";
      t.textContent = c.title;
      const x = document.createElement("button");
      x.className = "x";
      x.type = "button";
      x.textContent = "\u00d7";
      x.title = c.id === "main" ? "Clear this chat" : "Delete this chat";
      x.addEventListener("click", (e) => {
        e.stopPropagation();
        removeConv(c.id);
      });
      row.addEventListener("click", () => switchTo(c.id));
      row.append(t, x);
      convs.appendChild(row);
    }
  }

  async function switchTo(id) {
    if (controller) {
      controller.abort();
      controller = null;
      setStreaming(false);
    }
    currentAgent = null;
    updateAgentUi();
    currentId = id;
    chat.innerHTML = "";
    const res = await fetch("/conversations/" + id);
    if (!res.ok) {
      if (id !== "main") return switchTo("main");
      return;
    }
    const data = await res.json();
    if (currentId !== id) return;
    for (const m of data.messages) {
      addMessage(m.role === "user" ? "user" : "nova", m.text);
    }
    refreshList();
  }

  async function switchToAgent(name) {
    if (controller) {
      controller.abort();
      controller = null;
      setStreaming(false);
    }
    currentAgent = name;
    currentId = "";
    updateAgentUi();
    chat.innerHTML = "";
    refreshList();
    try {
      const res = await fetch("/api/agents/" + encodeURIComponent(name) + "/history");
      if (!res.ok) return;
      const data = await res.json();
      if (currentAgent !== name) return;
      for (const m of data.messages) {
        addMessage(m.role === "user" ? "user" : "nova", m.text);
      }
    } catch (err) {}
    box.focus();
  }

  async function loadAgents() {
    try {
      const res = await fetch("/api/agents");
      if (!res.ok) return;
      const items = await res.json();
      for (const a of items) {
        agentSpecs.set(a.name, a);
        const opt = document.createElement("option");
        opt.value = a.name;
        opt.textContent = a.name;
        agentSelect.appendChild(opt);
      }
      agentBar.hidden = items.length === 0;
    } catch (err) {}
  }

  agentSelect.addEventListener("change", () => {
    const name = agentSelect.value;
    if (name) {
      switchToAgent(name);
    } else {
      switchTo("main");
    }
  });

  agentClear.addEventListener("click", async () => {
    if (!currentAgent || controller) return;
    const name = currentAgent;
    if (!confirm("Clear the saved " + name + " conversation?")) return;
    try {
      await fetch("/api/agents/" + encodeURIComponent(name) + "/history", { method: "DELETE" });
    } catch (err) {}
    if (currentAgent === name) chat.innerHTML = "";
  });

  async function removeConv(id) {
    const msg = id === "main" ? "Clear the Main chat?" : "Delete this chat?";
    if (!confirm(msg)) return;
    await fetch("/conversations/" + id, { method: "DELETE" });
    if (id === currentId) {
      switchTo("main");
    } else {
      refreshList();
    }
  }

  document.getElementById("newchat").addEventListener("click", async () => {
    const res = await fetch("/conversations", { method: "POST" });
    const c = await res.json();
    await switchTo(c.id);
    box.focus();
  });

  async function loadSystem() {
    const res = await fetch("/system");
    const data = await res.json();
    promptBox.value = data.prompt;
  }

  function flashStatus(text) {
    status.textContent = text;
    setTimeout(() => { status.textContent = ""; }, 2000);
  }

  setBtn.addEventListener("click", async () => {
    const text = promptBox.value.trim();
    if (!text) {
      flashStatus("Empty!");
      return;
    }
    const res = await fetch("/system", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: text }),
    });
    flashStatus(res.ok ? "Saved" : "Error");
  });

  send.addEventListener("click", (e) => {
    if (controller) {
      e.preventDefault();
      controller.abort();
    }
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (controller) return;
    const text = box.value.trim();
    if (!text) return;
    box.value = "";
    const myId = currentId;
    const agent = currentAgent;
    const label = agent || "Nova";
    const url = agent ? "/api/agents/" + encodeURIComponent(agent) + "/chat" : "/chat";
    const payload = agent ? { message: text } : { message: text, conversation: myId };
    const myController = new AbortController();
    controller = myController;
    setStreaming(true);
    addMessage("user", text);
    const nova = addMessage("nova", "");
    nova.body.textContent = label + " is typing";
    nova.body.classList.add("typing");
    let started = false;
    let full = "";
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        signal: myController.signal,
      });
      if (!res.ok) {
        let msg = "Error " + res.status;
        try {
          const j = await res.json();
          if (j.error) msg = j.error;
        } catch (err) {}
        nova.body.classList.remove("typing");
        nova.body.textContent = "[" + msg + "]";
      } else {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          full += decoder.decode(value, { stream: true });
          const cut = full.indexOf("\u0000");
          const replyText = cut === -1 ? full : full.slice(0, cut);
          if (replyText) {
            if (!started) {
              nova.body.classList.remove("typing");
              started = true;
            }
            renderMarkdown(nova.body, replyText);
            chat.scrollTop = chat.scrollHeight;
          }
        }
        const cut = full.indexOf("\u0000");
        if (cut !== -1) {
          try {
            const u = JSON.parse(full.slice(cut + 1));
            nova.meta.textContent =
              "tokens: prompt " + u.prompt + " \u00b7 reply " + u.reply + " \u00b7 total " + u.total;
          } catch (err) {}
        }
        if (!started) {
          nova.body.classList.remove("typing");
          nova.body.textContent = "[No reply received.]";
        }
      }
    } catch (err) {
      nova.body.classList.remove("typing");
      if (err.name === "AbortError") {
        if (!started) {
          nova.body.textContent = "[Stopped.]";
        } else {
          nova.meta.textContent = "stopped";
        }
      } else {
        nova.body.textContent = "[Could not reach the server.]";
      }
    }
    if (controller === myController) {
      controller = null;
      setStreaming(false);
    }
    box.focus();
    if (!agent) refreshList();
  });

  switchTo("main");
  loadSystem();
  loadAgents();

  // ---- Tool approvals: poll the server and show Approve / Deny cards ----
  const approvalsBox = document.getElementById("approvals");
  const shownApprovals = new Map();

  async function answerApproval(id, approved) {
    const card = shownApprovals.get(id);
    if (card) card.querySelectorAll("button").forEach((b) => (b.disabled = true));
    try {
      await fetch("/approvals/" + encodeURIComponent(id), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ approved: approved }),
      });
    } catch (err) {}
    pollApprovals();
  }

  function buildApprovalCard(item) {
    const card = document.createElement("div");
    card.className = "approval";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "Nova wants to run: " + item.tool;
    const args = document.createElement("pre");
    args.textContent = item.arguments;
    const yes = document.createElement("button");
    yes.type = "button";
    yes.className = "yes";
    yes.textContent = "Approve";
    yes.addEventListener("click", () => answerApproval(item.id, true));
    const no = document.createElement("button");
    no.type = "button";
    no.className = "no";
    no.textContent = "Deny";
    no.addEventListener("click", () => answerApproval(item.id, false));
    card.append(title, args, yes, no);
    return card;
  }

  async function pollApprovals() {
    try {
      const res = await fetch("/approvals");
      if (!res.ok) return;
      const items = await res.json();
      const live = new Set(items.map((i) => i.id));
      for (const [id, card] of shownApprovals) {
        if (!live.has(id)) {
          card.remove();
          shownApprovals.delete(id);
        }
      }
      for (const item of items) {
        if (!shownApprovals.has(item.id)) {
          const card = buildApprovalCard(item);
          shownApprovals.set(item.id, card);
          approvalsBox.appendChild(card);
        }
      }
    } catch (err) {}
  }

  setInterval(pollApprovals, 1000);

  // ---- Workflows: plan, approve the plan, watch it run ----
  // Tool steps that change things still show the Approve / Deny cards above.
  const wfToggle = document.getElementById("wftoggle");
  const wfPanel = document.getElementById("wfpanel");
  const wfForm = document.getElementById("wfform");
  const wfGoal = document.getElementById("wfgoal");
  const wfWrite = document.getElementById("wfwrite");
  const wfPlanBtn = document.getElementById("wfplanbtn");
  const wfMsg = document.getElementById("wfmsg");
  const wfStateEl = document.getElementById("wfstate");
  const wfErr = document.getElementById("wferr");
  const wfPlan = document.getElementById("wfplan");
  const wfActions = document.getElementById("wfactions");
  const wfTasks = document.getElementById("wftasks");
  const wfResult = document.getElementById("wfresult");
  const wfSaved = document.getElementById("wfsaved");

  const WF_ACTIVE = ["planning", "awaiting_approval", "running"];
  const WF_LABELS = {
    idle: "",
    planning: "Planning...",
    awaiting_approval: "Review the plan. Nothing runs or is saved until you approve it.",
    running: "Running. A step that changes things will ask for approval above the message box.",
    done: "Finished.",
    cancelled: "Cancelled.",
    declined: "Plan discarded. Nothing was run or saved.",
    error: "Stopped.",
  };
  let wfOpen = false;
  let wfLastState = "idle";
  let wfLastSig = "";

  async function wfPost(url, body) {
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      let data = {};
      try { data = await res.json(); } catch (err) {}
      return { ok: res.ok, data: data };
    } catch (err) {
      return { ok: false, data: { error: "Could not reach the server." } };
    }
  }

  function wfButton(label, cls, onClick) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "wfbtn " + cls;
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  async function startWorkflow() {
    const goal = wfGoal.value.trim();
    if (!goal) {
      wfMsg.textContent = "Type a goal first.";
      return;
    }
    wfPlanBtn.disabled = true;
    const r = await wfPost("/workflows", { goal: goal, write_tools: wfWrite.checked });
    wfPlanBtn.disabled = false;
    if (!r.ok) {
      wfMsg.textContent = r.data.error || "Could not start.";
      return;
    }
    wfMsg.textContent = "";
    wfGoal.value = "";
    wfLastSig = "";
    pollWorkflow();
  }

  async function answerPlan(runId, approved) {
    const r = await wfPost("/workflows/" + encodeURIComponent(runId) + "/approve", { approved: approved });
    wfMsg.textContent = r.ok ? "" : (r.data.error || "That plan is no longer waiting.");
    wfLastSig = "";
    pollWorkflow();
  }

  async function cancelWorkflow(runId) {
    const r = await wfPost("/workflows/" + encodeURIComponent(runId) + "/cancel");
    wfMsg.textContent = r.ok ? "Stopping after the current step..." : (r.data.error || "Nothing to cancel.");
    wfLastSig = "";
    pollWorkflow();
  }

  async function resumeWorkflow(workflowId) {
    const r = await wfPost("/workflows/" + encodeURIComponent(workflowId) + "/resume");
    wfMsg.textContent = r.ok ? "" : (r.data.error || "Could not resume.");
    wfLastSig = "";
    pollWorkflow();
  }

  function renderWorkflow(snap) {
    const sig = JSON.stringify(snap);
    if (sig === wfLastSig) return;
    wfLastSig = sig;
    const state = snap.state;
    const active = WF_ACTIVE.includes(state);

    wfForm.hidden = active;
    let label = WF_LABELS[state] || "";
    if (label && snap.goal) label += "  Goal: " + snap.goal;
    wfStateEl.textContent = label;
    wfErr.textContent = snap.error || "";

    wfPlan.hidden = state !== "awaiting_approval" || !snap.plan;
    wfPlan.textContent = snap.plan || "";

    wfActions.innerHTML = "";
    if (state === "awaiting_approval") {
      wfActions.append(
        wfButton("Run plan", "yes", () => answerPlan(snap.id, true)),
        wfButton("Discard", "no", () => answerPlan(snap.id, false))
      );
    } else if (state === "planning" || state === "running") {
      wfActions.append(wfButton("Cancel", "no", () => cancelWorkflow(snap.id)));
    }

    wfTasks.innerHTML = "";
    if (state !== "awaiting_approval") {
      for (const t of snap.tasks || []) {
        const row = document.createElement("div");
        row.className = "wftask";
        const st = document.createElement("span");
        st.className = "st " + t.status;
        st.textContent = t.status;
        const text = document.createElement("div");
        text.textContent = t.description + (t.tool ? " [" + t.tool + "]" : "");
        if (t.detail) {
          const d = document.createElement("div");
          d.className = "detail";
          d.textContent = t.detail;
          text.appendChild(d);
        }
        row.append(st, text);
        wfTasks.appendChild(row);
      }
    }

    wfResult.hidden = !snap.result;
    wfResult.textContent = snap.result || "";
  }

  async function loadSaved() {
    wfSaved.innerHTML = "";
    let items = [];
    try {
      const res = await fetch("/workflows");
      if (!res.ok) {
        wfSaved.textContent = "Could not load saved workflows.";
        return;
      }
      items = await res.json();
    } catch (err) {
      wfSaved.textContent = "Could not load saved workflows.";
      return;
    }
    if (!items.length) {
      wfSaved.textContent = "None yet.";
      return;
    }
    for (const w of items) {
      const row = document.createElement("div");
      row.className = "wfsaved";
      const s = document.createElement("span");
      s.className = "s";
      s.textContent = w.status;
      const g = document.createElement("span");
      g.className = "g";
      g.textContent = w.goal || w.id;
      row.append(s, g);
      if (w.status === "pending" || w.status === "running") {
        row.appendChild(wfButton("Resume", "", () => resumeWorkflow(w.id)));
      }
      wfSaved.appendChild(row);
    }
  }

  async function pollWorkflow() {
    try {
      const res = await fetch("/workflows/current");
      if (!res.ok) return;
      const snap = await res.json();
      const active = WF_ACTIVE.includes(snap.state);
      wfToggle.textContent = "Workflows" + (active ? " \u25cf" : "");
      if (wfOpen) renderWorkflow(snap);
      if (snap.state !== wfLastState) {
        wfLastState = snap.state;
        if (wfOpen && !active) loadSaved();
      }
    } catch (err) {}
  }

  wfToggle.addEventListener("click", () => {
    wfOpen = !wfOpen;
    wfPanel.classList.toggle("open", wfOpen);
    if (wfOpen) {
      wfLastSig = "";
      pollWorkflow();
      loadSaved();
    }
  });
  wfPlanBtn.addEventListener("click", startWorkflow);
  wfGoal.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      startWorkflow();
    }
  });

  setInterval(pollWorkflow, 1000);
  pollWorkflow();
</script>
</body>
</html>
