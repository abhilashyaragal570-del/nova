<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova usage</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #222; background: #fff; }
  @media (prefers-color-scheme: dark) { body { color: #ddd; background: #181818; } th { border-color: #444; } td { border-color: #333; } }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid #ddd; }
  th { border-bottom: 2px solid #bbb; }
  td.num, th.num { text-align: right; }
  .stats { display: flex; flex-wrap: wrap; gap: 1.5rem; }
  .stat b { display: block; font-size: 1.4rem; }
  .muted { color: #888; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>Nova tool usage</h1>
<p class="muted"><a href="/">Back to chat</a> &middot; <a href="#" id="refresh">Refresh</a></p>
<div class="stats" id="stats"></div>
<p class="muted" id="skipped"></p>
<h2>Latency</h2>
<div class="stats" id="latency"></div>
<p class="muted" id="latency-note"></p>
<h2>Workflows</h2>
<div class="stats" id="workflows"></div>
<p class="muted" id="workflows-note"></p>
<table id="workflow-statuses"></table>
<h2>Tools used</h2>
<table id="tools"></table>
<h2>By source</h2>
<table id="sources"></table>
<script>
function cell(tag, text, cls) {
  const el = document.createElement(tag);
  el.textContent = text;
  if (cls) el.className = cls;
  return el;
}
function fillTable(id, headers, rows) {
  const table = document.getElementById(id);
  table.replaceChildren();
  const head = document.createElement("tr");
  headers.forEach((h, i) => head.appendChild(cell("th", h, i > 0 ? "num" : "")));
  table.appendChild(head);
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = cell("td", "(none)", "muted");
    td.colSpan = headers.length;
    tr.appendChild(td);
    table.appendChild(tr);
    return;
  }
  rows.forEach(row => {
    const tr = document.createElement("tr");
    row.forEach((v, i) => tr.appendChild(cell("td", v, i > 0 ? "num" : "")));
    table.appendChild(tr);
  });
}
function stat(label, value) {
  const box = document.createElement("div");
  box.className = "stat";
  const b = document.createElement("b");
  b.textContent = value;
  box.appendChild(b);
  box.appendChild(document.createTextNode(label));
  return box;
}
function seconds(value) {
  return Number(value).toFixed(2) + "s";
}
function showLatency(latency) {
  const box = document.getElementById("latency");
  const note = document.getElementById("latency-note");
  if (!latency) {
    box.replaceChildren();
    note.textContent = "No timed turns yet. Chat in the web app and refresh to see how long replies take.";
    return;
  }
  box.replaceChildren(
    stat("average", seconds(latency.average_seconds)),
    stat("median", seconds(latency.median_seconds)),
    stat("95th percentile", seconds(latency.p95_seconds)),
    stat("slowest", seconds(latency.max_seconds))
  );
  let text = "Based on " + latency.turns.toLocaleString() + " timed turn(s). Turns from before timing was added are left out.";
  if (latency.turns_with_approval) {
    text += " Time spent waiting for your Approve or Deny click (" +
      seconds(latency.approval_wait_seconds) + " over " +
      latency.turns_with_approval.toLocaleString() + " turn(s)) is not counted.";
  }
  note.textContent = text;
}
function showWorkflows(workflows) {
  const box = document.getElementById("workflows");
  const note = document.getElementById("workflows-note");
  if (!workflows) {
    box.replaceChildren();
    document.getElementById("workflow-statuses").replaceChildren();
    note.textContent = "No workflow runs yet. Run a workflow from the chat page and refresh.";
    return;
  }
  const stats = [
    stat("runs", workflows.runs.toLocaleString()),
    stat("tasks", workflows.tasks.toLocaleString()),
    stat("tool calls", workflows.tool_calls.toLocaleString())
  ];
  if (workflows.timed_runs) {
    stats.push(
      stat("average", seconds(workflows.average_seconds)),
      stat("median", seconds(workflows.median_seconds)),
      stat("slowest", seconds(workflows.max_seconds))
    );
  }
  box.replaceChildren(...stats);
  let text = workflows.timed_runs
    ? "Times are based on " + workflows.timed_runs.toLocaleString() + " timed run(s)."
    : "No run has a recorded time yet.";
  if (workflows.runs_with_approval) {
    text += " Time spent waiting for your Approve or Deny click (" +
      seconds(workflows.approval_wait_seconds) + " over " +
      workflows.runs_with_approval.toLocaleString() + " run(s)) is not counted.";
  }
  note.textContent = text;
  const statuses = Object.entries(workflows.statuses)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([name, count]) => [name, count.toLocaleString()]);
  fillTable("workflow-statuses", ["Final status", "Runs"], statuses);
}
async function load() {
  const res = await fetch("/api/usage");
  if (!res.ok) {
    document.getElementById("stats").textContent = "Could not load usage (error " + res.status + ").";
    return;
  }
  const d = await res.json();
  const stats = document.getElementById("stats");
  stats.replaceChildren(
    stat("turns", d.turns.toLocaleString()),
    stat("total tokens", d.total_tokens.toLocaleString()),
    stat("turns with no tools", d.no_tool_turns.toLocaleString()),
    stat("hit the round limit", d.limit_hits.toLocaleString())
  );
  document.getElementById("skipped").textContent =
    d.skipped ? d.skipped + " unreadable log line(s) skipped." : "";
  showLatency(d.latency);
  showWorkflows(d.workflows);
  const tools = Object.entries(d.tools)
    .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
    .map(([name, count]) => [name, count.toLocaleString()]);
  fillTable("tools", ["Tool", "Calls"], tools);
  const sources = Object.entries(d.sources)
    .sort((a, b) => b[1].tokens - a[1].tokens || a[0].localeCompare(b[0]))
    .map(([name, s]) => [name, s.turns.toLocaleString(), s.tokens.toLocaleString()]);
  fillTable("sources", ["Source", "Turns", "Tokens"], sources);
}
document.getElementById("refresh").addEventListener("click", e => { e.preventDefault(); load(); });
load();
</script>
</body>
</html>
